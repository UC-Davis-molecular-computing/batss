[package]
name = "batss"
# The single source of truth for the package version, including on PyPI:
# pyproject.toml declares `dynamic = ["version"]`, which tells maturin to read the
# version from here (https://www.maturin.rs/metadata). doc/conf.py also parses it.
version = "1.0.4"
edition = "2021"

[lib]
name = "batss_rust"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rebop"
path = "src/generate_rebop_samples.rs"

[[bin]]
name = "time_rebop"
path = "src/rebop_runtime_sampling.rs"

[features]
flm = ["flame"] # Enable flame profiling to be switched on/off


[dependencies]
# rug = { version = "1", default-features = false, features = ["float"] }
# gmp-mpfr-sys = {version = "1.6", features = ["use-system-libs"]}
num-format = "0.4"
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py310"] }
numpy = "0.28"
ndarray = "0.16"
rand = { version = "0.9", features = [
    "small_rng",
] } # need version 0.8 of rand to use it with statrs, fails with version 0.9
nalgebra = "0.33"
flame = { version = "0.2", optional = true } # Make flame optional so we can turn it on/off
special = "0.11"
rand_distr = "0.5"
num-integer = "0.1"
num-bigint = "0.4"
lazy_static = "1"
stybulate = "1"
itertools = "0.14.0"
compensated-summation = "0.3.1"
rebop = { version = "0.9.7", default-features = false }
serde_json = "1.0"
tqdm = "0.8"

# EXPERIMENT (issue #13): point rebop at a local fork of v0.9.7 that adds
# `Gillespie::advance_until_or_reactions(tmax, max_reactions)` -- the upstream loop with one extra
# stopping condition, so a Gillespie block can be budgeted by reaction count instead of by a
# duration inferred from the entry propensity.
#
# This is a *path* patch and therefore only works on a checkout that also has the fork beside it;
# CI and other machines will fail to resolve it. Before merging anywhere, replace it with a git
# dependency on the published fork:
#     rebop = { git = "https://github.com/<org>/rebop", branch = "num-reactions-stopping-condition" }
[patch.crates-io]
rebop = { path = "../rebop" }
