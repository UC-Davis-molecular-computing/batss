name: Build and Publish Python Package

on:
  release:
    types: [published]
  workflow_dispatch:  # Keeping manual trigger for testing

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        # Build only architectures common in personal computers: x86_64 and arm64
        # (aarch64). Dropped 32-bit x86, armv7, and the server-only s390x/ppc64le —
        # near-zero desktop audience, and 32-bit x86 can't even resolve (NumPy 2 ships
        # no 32-bit wheels for Python >=3.10). sdist remains for anything omitted; the
        # musllinux and windows jobs follow the same policy.
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        # Same personal-computer arch policy as the linux job: x86_64 + arm64 only.
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        # x64 only; 32-bit win32 has no NumPy 2 wheels and near-zero desktop use.
        platform:
          - runner: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        # macOS hosted runners retire on GitHub's N-1 OS-version cadence: macos-13
        # (Ventura) was retired 2025-12-04, which is why a macos-13 job now hangs
        # unassigned. Pin to currently-supported macOS 15 and build BOTH Mac
        # architectures — macos-15 (Apple Silicon / arm64) and macos-15-intel
        # (Intel / x86_64) — so wheels cover essentially all Mac users. Intel hosted
        # runners exist until ~Fall 2027; bump both labels when macOS 15 nears retirement.
        platform:
          - runner: macos-15-intel
            target: x86_64
            deployment_target: "10.13"   # reach older Intel Macs (High Sierra, 2017+)
          - runner: macos-15
            target: aarch64
            deployment_target: "11.0"     # Apple Silicon floor (Big Sur); arm64 ignores lower
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.platform.deployment_target }}
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    # Publish to PyPI ONLY for an actual GitHub Release. A manual "Run workflow"
    # (workflow_dispatch) then builds every platform WITHOUT publishing — a safe
    # all-platform build test that never touches PyPI.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [linux, musllinux, windows, macos, sdist]
    environment: pypi
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'wheels-*/*'
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*
