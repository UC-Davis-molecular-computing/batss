version: 2

build:
  os: ubuntu-lts-latest
  tools:
    python: "3.13"
  jobs:
    pre_install:
      - pip install uv
    post_checkout:
      - uv sync --extra docs
    post_install:
      - uv run python -c "import batss; print('Package imported successfully')"

sphinx:
  configuration: doc/conf.py