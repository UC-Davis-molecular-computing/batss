version: 2

build:
  os: ubuntu-lts-latest
  tools:
    python: "3.13"
  jobs:
    pre_install:
      - pip install uv
      - export PATH="$HOME/.local/bin:$PATH"
    post_checkout:
      - python -m uv sync --extra docs
    post_install:
      - python -m uv run python -c "import batss; print('Package imported successfully')"

sphinx:
  configuration: doc/conf.py